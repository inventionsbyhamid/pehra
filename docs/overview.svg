<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Pehra overview</title>
  <desc id="desc">Cameras (CCTV, phone, bridge, upload) feed ingest and OpenCV perception (detect, track, zones and lines, faces at entries, plates, camera health). Watches in plain words flag moments, an AI check looks at them, and incidents reach the control room and Telegram. Perception also fills the gate log and staff register. It runs on AWS (EC2 Graviton, S3, Bedrock, SSM, CloudWatch, SNS, CloudFormation) or self hosted with Docker.</desc>
  <style>
    .t { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h2 { font-size: 17px; font-weight: 700; }
    .b { font-size: 15px; }
    .s { font-size: 14px; }
    .h3 { font-size: 15px; font-weight: 700; }
    .m { fill: #57606a; }
    .cvt { fill: #4a2fa0; }
    .awt { fill: #9a4700; }
    .agt { fill: #1f5f99; }
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .cv { fill: #f3f0ff; stroke: #5b3cc4; stroke-width: 1.6; }
    .ag { fill: #eef6ff; stroke: #2f6fbf; stroke-width: 1.4; }
    .aws { fill: #fff4e5; stroke: #c65d00; stroke-width: 1.4; }
    .ln { fill: none; stroke: #57606a; stroke-width: 1.5; }
    .hd { fill: #57606a; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="hd"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1039" height="559" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- row 1: cameras, ingest, OpenCV perception -->
  <rect class="box" x="24" y="24" width="190" height="196" rx="8"/>
  <text class="t h2" x="42" y="56">Cameras</text>
  <text class="t b m" x="42" y="96">CCTV</text>
  <text class="t b m" x="42" y="126">Phone</text>
  <text class="t b m" x="42" y="156">Bridge</text>
  <text class="t b m" x="42" y="186">Upload</text>

  <path class="ln" d="M214,122 H250" marker-end="url(#a)"/>

  <rect class="box" x="252" y="82" width="120" height="80" rx="8"/>
  <text class="t h2" x="312" y="128" text-anchor="middle">Ingest</text>

  <path class="ln" d="M372,122 H408" marker-end="url(#a)"/>

  <rect class="cv" x="410" y="24" width="606" height="196" rx="8"/>
  <text class="t h2 cvt" x="432" y="56">OpenCV perception</text>
  <text class="t b" x="432" y="104">Detect</text>
  <text class="t b" x="432" y="140">Track</text>
  <text class="t b" x="432" y="176">Zones and lines</text>
  <text class="t b" x="700" y="104">Faces at entries</text>
  <text class="t b" x="700" y="140">Plates</text>
  <text class="t b" x="700" y="176">Camera health</text>

  <!-- row 2: watches, AI check, incidents, where it shows -->
  <path class="ln" d="M540,220 V262 H109 V298" marker-end="url(#a)"/>
  <path class="ln" d="M898,220 V270" marker-end="url(#a)"/>

  <rect class="box" x="24" y="300" width="170" height="80" rx="8"/>
  <text class="t h2" x="109" y="336" text-anchor="middle">Watches</text>
  <text class="t s m" x="109" y="358" text-anchor="middle">in plain words</text>

  <path class="ln" d="M194,340 H234" marker-end="url(#a)"/>

  <rect class="ag" x="236" y="300" width="170" height="80" rx="8"/>
  <text class="t h2 agt" x="321" y="346" text-anchor="middle">AI check</text>

  <path class="ln" d="M406,340 H446" marker-end="url(#a)"/>

  <rect class="box" x="448" y="300" width="170" height="80" rx="8"/>
  <text class="t h2" x="533" y="346" text-anchor="middle">Incidents</text>

  <path class="ln" d="M618,340 H778" marker-end="url(#a)"/>
  <path class="ln" d="M700,340 V388 H778" marker-end="url(#a)"/>

  <rect class="box" x="780" y="272" width="236" height="40" rx="8"/>
  <text class="t h2" x="898" y="298" text-anchor="middle">Gate log and register</text>
  <rect class="box" x="780" y="320" width="236" height="40" rx="8"/>
  <text class="t h2" x="898" y="346" text-anchor="middle">Control room</text>
  <rect class="box" x="780" y="368" width="236" height="40" rx="8"/>
  <text class="t h2" x="898" y="394" text-anchor="middle">Telegram</text>

  <!-- where it runs -->
  <line x1="24" y1="432" x2="1016" y2="432" stroke="#d0d7de"/>

  <rect class="aws" x="24" y="452" width="130" height="48" rx="8"/>
  <text class="t h3 awt" x="89" y="482" text-anchor="middle">EC2 Graviton</text>
  <rect class="aws" x="168" y="452" width="130" height="48" rx="8"/>
  <text class="t h3 awt" x="233" y="482" text-anchor="middle">S3</text>
  <rect class="aws" x="312" y="452" width="130" height="48" rx="8"/>
  <text class="t h3 awt" x="377" y="482" text-anchor="middle">Bedrock</text>
  <rect class="aws" x="456" y="452" width="130" height="48" rx="8"/>
  <text class="t h3 awt" x="521" y="482" text-anchor="middle">SSM</text>
  <rect class="aws" x="600" y="452" width="130" height="48" rx="8"/>
  <text class="t h3 awt" x="665" y="482" text-anchor="middle">CloudWatch</text>
  <rect class="aws" x="744" y="452" width="130" height="48" rx="8"/>
  <text class="t h3 awt" x="809" y="482" text-anchor="middle">SNS</text>
  <rect class="aws" x="888" y="452" width="128" height="48" rx="8"/>
  <text class="t h3 awt" x="952" y="482" text-anchor="middle">CloudFormation</text>
  <text class="t s m" x="24" y="532">or self hosted with Docker</text>
</svg>
