<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="940" viewBox="0 0 1300 940" role="img" aria-labelledby="title desc">
  <title id="title">Pehra architecture</title>
  <desc id="desc">Recorders, the Pehra bridge, laptops and phones at a housing society send pictures to one EC2 c8g.xlarge from the COOL image in AWS Mumbai. Camera processes run the OpenCV 5 pipeline; the FastAPI app runs the verifier agent with OpenCV tools; a job worker sends Telegram alerts with faces blurred. S3, Bedrock, CloudWatch, SSM and CloudFormation complete the AWS side.</desc>
  <style>
    .bg { fill: #ffffff; }
    .t { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h1 { font-size: 22px; font-weight: 700; }
    .h2 { font-size: 14.5px; font-weight: 700; }
    .b { font-size: 12.5px; }
    .s { font-size: 11.5px; }
    .m { fill: #57606a; }
    .cvt { fill: #4a2fa0; }
    .awt { fill: #9a4700; }
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .cv { fill: #f3f0ff; stroke: #5b3cc4; stroke-width: 1.6; }
    .aws { fill: #fff4e5; stroke: #c65d00; stroke-width: 1.6; }
    .region { fill: none; stroke: #c65d00; stroke-width: 1.4; stroke-dasharray: 7 5; }
    .inst { fill: none; stroke: #8c959f; stroke-width: 1.2; }
    .ln { fill: none; stroke: #57606a; stroke-width: 1.5; }
    .hd { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .cvt { fill: #c4b5ff; }
      .awt { fill: #f5b56f; }
      .box { fill: #161b22; stroke: #3d444d; }
      .cv { fill: #1d1638; stroke: #a991ff; }
      .aws { fill: #2a1d0c; stroke: #f0a35a; }
      .region { stroke: #f0a35a; }
      .inst { stroke: #3d444d; }
      .ln { stroke: #9198a1; }
      .hd { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="hd"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1300" height="940" rx="12"/>
  <text class="t h1" x="24" y="40">Pehra architecture</text>
  <text class="t s m" x="24" y="60">OpenCV 5 in violet, AWS in orange, other parts in grey. The AWS deployment is built and tested and waits on the owner's go ahead.</text>

  <!-- at the society -->
  <rect class="box" x="24" y="92" width="250" height="64" rx="8"/>
  <text class="t h2" x="40" y="116">Recorders and IP cameras</text>
  <text class="t b m" x="40" y="137">Hikvision, CP Plus, Dahua; RTSP</text>

  <rect class="box" x="24" y="196" width="250" height="66" rx="8"/>
  <text class="t h2" x="40" y="220">Committee and supervisor</text>
  <text class="t b m" x="40" y="241">the web app, over HTTPS</text>

  <rect class="cv" x="24" y="282" width="250" height="92" rx="8"/>
  <text class="t h2 cvt" x="40" y="306">Pehra bridge</text>
  <text class="t b" x="40" y="327">a computer at the society: OpenCV</text>
  <text class="t b" x="40" y="345">reads RTSP on the LAN and pushes</text>
  <text class="t b" x="40" y="363">JPEG out; no port forwarding</text>

  <rect class="cv" x="24" y="394" width="250" height="92" rx="8"/>
  <text class="t h2 cvt" x="40" y="418">A laptop or phone as a camera</text>
  <text class="t b" x="40" y="439">a link or a QR code; OpenCV.js</text>
  <text class="t b" x="40" y="457">YuNet blurs every face before a</text>
  <text class="t b" x="40" y="475">frame leaves the device</text>

  <text class="t s m" x="24" y="526">Bridge and phone push over a</text>
  <text class="t s m" x="24" y="543">WebSocket with a camera device</text>
  <text class="t s m" x="24" y="560">token, kept only as a hash.</text>
  <text class="t s m" x="24" y="594">The test server runs the same code</text>
  <text class="t s m" x="24" y="611">in one x86 container: stock OpenCV,</text>
  <text class="t s m" x="24" y="628">local disk, OpenRouter for the AI.</text>

  <rect class="cv" x="24" y="664" width="250" height="196" rx="8"/>
  <text class="t h2 cvt" x="40" y="688">COOL</text>
  <text class="t b" x="40" y="709">Cloud Optimized OpenCV Library</text>
  <text class="t b" x="40" y="727">for Graviton4, from AWS</text>
  <text class="t b" x="40" y="745">Marketplace: OpenCV 5 built with</text>
  <text class="t b" x="40" y="763">Arm KleidiCV. Every OpenCV call</text>
  <text class="t b" x="40" y="781">on the instance runs on it.</text>
  <text class="t b" x="40" y="799">Proof: cv2 is loaded from under</text>
  <text class="t b" x="40" y="817">/opt/cool (deploy/cv2_info.py).</text>
  <text class="t s m" x="40" y="843">Not yet run on AWS.</text>

  <!-- AWS region -->
  <rect class="region" x="300" y="72" width="718" height="808" rx="12"/>
  <text class="t h2 awt" x="316" y="94">AWS, ap-south-1 (Mumbai)</text>

  <!-- RTSP pull, over the top into the camera processes -->
  <path class="ln" d="M274,112 H699 V158" marker-end="url(#a)"/>
  <text class="t s m" x="532" y="106">RTSP pull, rtsp and rtsps only</text>

  <!-- HTTPS and WebSocket bus into Caddy -->
  <path class="ln" d="M274,229 H287"/>
  <path class="ln" d="M274,328 H287"/>
  <path class="ln" d="M274,440 H287"/>
  <path class="ln" d="M287,440 V187 H332" marker-end="url(#a)"/>

  <rect class="inst" x="318" y="124" width="688" height="516" rx="10"/>
  <text class="t h2" x="334" y="146">EC2 c8g.xlarge: Graviton4, from the COOL image</text>

  <!-- column 1: Caddy, app, verifier -->
  <rect class="box" x="334" y="160" width="232" height="54" rx="8"/>
  <text class="t h2" x="350" y="182">Caddy</text>
  <text class="t b m" x="350" y="201">TLS; tokens cut from the log</text>
  <path class="ln" d="M450,214 V228" marker-end="url(#a)"/>

  <rect class="box" x="334" y="230" width="232" height="108" rx="8"/>
  <text class="t h2" x="350" y="253">FastAPI app</text>
  <text class="t s m" x="350" y="271">one uvicorn worker</text>
  <text class="t b" x="350" y="291">society API, sign in, roles</text>
  <text class="t b" x="350" y="309">live and device sockets</text>
  <text class="t b" x="350" y="327">camera manager, billing, demo</text>
  <path class="ln" d="M450,338 V352" marker-end="url(#a)"/>

  <rect class="cv" x="334" y="354" width="232" height="174" rx="8"/>
  <text class="t h2 cvt" x="350" y="378">Verifier agent</text>
  <text class="t s m" x="350" y="396">in the app's check pool,</text>
  <text class="t s m" x="350" y="412">live critical first</text>
  <text class="t b" x="350" y="434">OpenCV tools: frames, zoom,</text>
  <text class="t b" x="350" y="452">CLAHE, denoise, DIS flow,</text>
  <text class="t b" x="350" y="470">pose history, the path walked</text>
  <text class="t b" x="350" y="492">alert with a grade, dismiss,</text>
  <text class="t b" x="350" y="510">ask a person, cannot judge</text>
  <path class="ln" d="M450,528 V658" marker-end="url(#a)"/>
  <text class="t s m" x="458" y="600">flagged</text>
  <text class="t s m" x="458" y="615">moments only</text>

  <!-- app and camera processes -->
  <path class="ln" d="M568,284 H596" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- column 2: camera processes -->
  <rect class="cv" x="598" y="160" width="202" height="464" rx="8"/>
  <text class="t h2 cvt" x="614" y="184">Camera processes</text>
  <text class="t s m" x="614" y="202">one per vCPU; models loaded</text>
  <text class="t s m" x="614" y="218">once per process</text>
  <text class="t b" x="614" y="242">decode with FFmpeg, resize</text>
  <text class="t b" x="614" y="261">night: CLAHE on lightness</text>
  <text class="t b" x="614" y="280">health: ORB, MAGSAC,</text>
  <text class="t b" x="614" y="299">Laplacian, meanStdDev</text>
  <text class="t b" x="614" y="318">MOG2 motion gate</text>
  <text class="t b" x="614" y="337">YOLOX through cv2.dnn</text>
  <text class="t b" x="614" y="356">Kalman tracker, 3 passes</text>
  <text class="t b" x="614" y="375">zones and directed lines</text>
  <text class="t b" x="614" y="394">DIS optical flow</text>
  <text class="t s m" x="614" y="418">when a watch needs it:</text>
  <text class="t b" x="614" y="437">MediaPipe pose</text>
  <text class="t b" x="614" y="456">YuNet and SFace</text>
  <text class="t b" x="614" y="475">LPD-YuNet and PP-OCRv5</text>
  <text class="t b" x="614" y="494">SigLIP 2 (ONNX Runtime)</text>
  <text class="t b" x="614" y="518">watch engine: signals,</text>
  <text class="t b" x="614" y="537">rules, candidates</text>
  <text class="t s m" x="614" y="561">reports to the app by</text>
  <text class="t s m" x="614" y="577">messages; never opens</text>
  <text class="t s m" x="614" y="593">the database</text>
  <path class="ln" d="M699,624 V658" marker-end="url(#a)"/>
  <text class="t s m" x="707" y="655">keyframes, clips</text>

  <!-- column 3: scan workers, job worker, database -->
  <rect class="cv" x="816" y="160" width="178" height="70" rx="8"/>
  <text class="t h2 cvt" x="832" y="184">Scan workers</text>
  <text class="t b" x="832" y="204">uploads in time chunks</text>
  <text class="t b" x="832" y="221">on every core</text>

  <rect class="cv" x="816" y="246" width="178" height="208" rx="8"/>
  <text class="t h2 cvt" x="832" y="270">Job worker</text>
  <text class="t b" x="832" y="292">Telegram posts, edits</text>
  <text class="t b" x="832" y="310">and reminders</text>
  <text class="t b" x="832" y="328">stills: faces blurred</text>
  <text class="t b" x="832" y="346">(YuNet, SFace, pose)</text>
  <text class="t b" x="832" y="364">daily summary</text>
  <text class="t b" x="832" y="382">staff attendance</text>
  <text class="t b" x="832" y="400">stays at the gate</text>
  <text class="t b" x="832" y="418">retention, demo reset</text>
  <text class="t b" x="832" y="436">billing sweep</text>
  <path class="ln" d="M905,456 V470" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect class="box" x="816" y="472" width="178" height="68" rx="8"/>
  <text class="t h2" x="832" y="495">SQLite (WAL)</text>
  <text class="t b m" x="832" y="514">every row under its</text>
  <text class="t b m" x="832" y="531">society; the job queue</text>
  <path class="ln" d="M905,540 V658" marker-end="url(#a)"/>
  <text class="t s m" x="913" y="600">Litestream</text>
  <text class="t s m" x="913" y="615">copy</text>

  <!-- Telegram, outside AWS -->
  <path class="ln" d="M994,330 H1034" marker-end="url(#a)"/>
    <rect class="box" x="1036" y="262" width="246" height="132" rx="8"/>
  <text class="t h2" x="1052" y="286">Society's Telegram group</text>
  <text class="t b" x="1052" y="307">one message per incident,</text>
  <text class="t b" x="1052" y="325">edited as it changes; a still</text>
  <text class="t b" x="1052" y="343">crop, never a clip; Acknowledge</text>
  <text class="t b" x="1052" y="361">and False alarm, back by webhook</text>
  <text class="t s m" x="1052" y="379">posted through the Bot API</text>

  <rect class="box" x="1036" y="412" width="246" height="80" rx="8"/>
  <text class="t h2" x="1052" y="436">Also outside AWS</text>
  <text class="t b" x="1052" y="457">Polar billing, Google sign in;</text>
  <text class="t b" x="1052" y="475">OpenRouter on the test server</text>

  <!-- AWS services -->
  <rect class="aws" x="334" y="660" width="232" height="96" rx="8"/>
  <text class="t h2 awt" x="350" y="684">Amazon Bedrock</text>
  <text class="t b" x="350" y="705">Claude Haiku 5.5, the only model</text>
  <text class="t b" x="350" y="723">the role may call; daily caps</text>
  <text class="t b m" x="350" y="741">per society and for the demo</text>

  <rect class="aws" x="598" y="660" width="396" height="96" rx="8"/>
  <text class="t h2 awt" x="614" y="684">Amazon S3</text>
  <text class="t b" x="614" y="705">pictures, clips and the database copy, every key under its</text>
  <text class="t b" x="614" y="723">society; versioned, encrypted, TLS only, no public access</text>
  <text class="t b m" x="614" y="741">Object Lock is on for the bucket, not yet used by the app</text>

  <rect class="aws" x="334" y="772" width="232" height="94" rx="8"/>
  <text class="t h2 awt" x="350" y="796">Amazon CloudWatch</text>
  <text class="t b" x="350" y="817">logs, metrics, a dashboard,</text>
  <text class="t b" x="350" y="835">six alarms by SNS email</text>

  <rect class="aws" x="598" y="772" width="182" height="94" rx="8"/>
  <text class="t h2 awt" x="614" y="796">SSM</text>
  <text class="t b" x="614" y="817">Parameter Store:</text>
  <text class="t b" x="614" y="835">settings, secrets</text>

  <rect class="aws" x="796" y="772" width="198" height="94" rx="8"/>
  <text class="t h2 awt" x="812" y="796">CloudFormation</text>
  <text class="t b" x="812" y="817">one command deploy,</text>
  <text class="t b" x="812" y="835">no SSH; a budget alarm</text>

  <!-- legend -->
  <rect class="cv" x="24" y="900" width="14" height="14" rx="3"/>
  <text class="t s" x="46" y="912">OpenCV 5</text>
  <rect class="aws" x="112" y="900" width="14" height="14" rx="3"/>
  <text class="t s" x="134" y="912">AWS</text>
  <rect class="box" x="180" y="900" width="14" height="14" rx="3"/>
  <text class="t s" x="202" y="912">other parts</text>
</svg>
