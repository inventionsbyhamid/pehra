<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="748" viewBox="0 0 1120 748" role="img" aria-labelledby="title desc">
  <title id="title">Pehra architecture</title>
  <desc id="desc">At the society: the committee in a browser, a phone or laptop as a camera, the Pehra bridge, and CCTV cameras and recorders over RTSP. In AWS Mumbai, one EC2 Graviton4 instance with COOL (OpenCV 5 built for Graviton) runs the web app, the camera processes (decode, motion gate, detect, track, zones and lines, pose, faces at entries, plates, camera health), the AI check with its OpenCV tools, and the job worker. S3 keeps pictures, clips and the database copy; Bedrock runs the AI check; Parameter Store holds settings and secrets; CloudWatch has logs, metrics and alarms; SNS sends alarm email; CloudFormation builds the whole stack. Alerts go to the society's Telegram group.</desc>
  <style>
    .t { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 16px; font-weight: 700; }
    .d { font-size: 14px; }
    .l { font-size: 13px; fill: #57606a; }
    .m { fill: #57606a; }
    .cvt { fill: #4a2fa0; }
    .awt { fill: #9a4700; }
    .agt { fill: #1f5f99; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .cv { fill: #f3f0ff; stroke: #5b3cc4; stroke-width: 1.6; }
    .ag { fill: #eef6ff; stroke: #2f6fbf; stroke-width: 1.4; }
    .aws { fill: #fff4e5; stroke: #c65d00; stroke-width: 1.4; }
    .region { fill: none; stroke: #c65d00; stroke-width: 1.4; stroke-dasharray: 7 5; }
    .inst { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .ln { fill: none; stroke: #57606a; stroke-width: 1.5; }
    .hd { fill: #57606a; }
  </style>
