<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="772" viewBox="0 0 1040 772" role="img" aria-labelledby="title desc">
  <title id="title">Pehra agent workflow</title>
  <desc id="desc">Perceive: a camera frame from RTSP, the bridge, a phone or an upload goes through OpenCV (decode, motion gate, detect, track, zones and lines, pose, faces at entries, plates, camera health). Decide: the watch engine checks a watch's signals and rules; if they do not hold, nothing is sent. Camera health and enrolled staff faces go straight to an incident with no AI step. Every other flagged moment goes to the AI check, which calls OpenCV tools (more frames, zoom, brighten, denoise, flow, pose, the path walked) and reads each result before its next step, until it raises an alert with a grade, asks a person, says it cannot judge, or dismisses the moment. Act: an incident opens in the control room and is posted to the society's Telegram group, and Acknowledge or False alarm comes back as feedback.</desc>
  <style>
    .t { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 16px; font-weight: 700; }
    .hb { font-size: 18px; font-weight: 700; }
    .d { font-size: 14px; }
    .e { font-size: 15px; }
    .l { font-size: 13px; fill: #57606a; }
    .band { font-size: 14px; font-weight: 700; fill: #57606a; }
    .m { fill: #57606a; }
    .cvt { fill: #4a2fa0; }
    .agt { fill: #1f5f99; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .cv { fill: #f3f0ff; stroke: #5b3cc4; stroke-width: 1.6; }
    .ag { fill: #eef6ff; stroke: #2f6fbf; stroke-width: 1.6; }
    .sep { stroke: #d0d7de; stroke-width: 1; }
    .ln { fill: none; stroke: #57606a; stroke-width: 1.5; }
    .hd { fill: #57606a; }
    .call { fill: none; stroke: #2f6fbf; stroke-width: 2.2; }
    .back { fill: none; stroke: #5b3cc4; stroke-width: 2.2; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="hd"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fbf"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b3cc4"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1039" height="771" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- bands -->
  <line class="sep" x1="24" y1="138" x2="1016" y2="138"/>
  <line class="sep" x1="24" y1="584" x2="1016" y2="584"/>
  <text class="t band" x="1016" y="44" text-anchor="end">Perceive</text>
  <text class="t band" x="1016" y="164" text-anchor="end">Decide</text>
  <text class="t band" x="1016" y="610" text-anchor="end">Act</text>

  <!-- perceive -->
  <rect class="box" x="120" y="38" width="230" height="64" rx="8"/>
  <text class="t h" x="136" y="64">Camera frame</text>
  <text class="t d m" x="136" y="86">RTSP, bridge, phone, upload</text>

  <path class="ln" d="M350,70 H388" marker-end="url(#a)"/>

  <rect class="cv" x="390" y="24" width="500" height="92" rx="8"/>
  <text class="t h cvt" x="406" y="50">OpenCV perceives</text>
  <text class="t d m" x="874" y="50" text-anchor="end">every analysed frame</text>
  <text class="t e" x="406" y="78">decode, motion gate, detect, track, zones and lines,</text>
  <text class="t e" x="406" y="100">pose, faces at entries, plates, camera health</text>

  <!-- decide in code -->
  <path class="ln" d="M440,116 V158" marker-end="url(#a)"/>

  <rect class="box" x="240" y="160" width="240" height="64" rx="8"/>
  <text class="t h" x="256" y="186">Watch engine</text>
  <text class="t d m" x="256" y="208">a watch's signals and rules</text>

  <path class="ln" d="M480,192 H558" marker-end="url(#a)"/>
  <text class="t l" x="519" y="184" text-anchor="middle">no</text>
  <rect class="box" x="560" y="160" width="200" height="64" rx="8"/>
  <text class="t h" x="576" y="186">Nothing sent</text>
  <text class="t d m" x="576" y="208">no AI call, no message</text>

  <!-- no AI step -->
  <path class="ln" d="M240,192 H170 V648 H228" marker-end="url(#a)"/>
  <text class="t l" x="160" y="396" text-anchor="end" font-weight="700">no AI step</text>
  <text class="t l" x="160" y="414" text-anchor="end">camera health,</text>
  <text class="t l" x="160" y="431" text-anchor="end">staff face</text>

  <path class="ln" d="M360,224 V288" marker-end="url(#a)"/>
  <text class="t l" x="370" y="262">flagged moment</text>

  <!-- the agent loop -->
  <rect class="ag" x="230" y="290" width="260" height="150" rx="10"/>
  <text class="t hb agt" x="248" y="320">AI check</text>
  <text class="t d" x="248" y="348">the watch's question</text>
  <text class="t d" x="248" y="370">what OpenCV saw</text>
  <text class="t d" x="248" y="392">a few stills, never video</text>
  <text class="t d m" x="248" y="422">one tool call a step</text>

  <rect class="cv" x="630" y="290" width="260" height="150" rx="10"/>
  <text class="t hb cvt" x="648" y="320">OpenCV tools</text>
  <text class="t e" x="648" y="350">more frames</text>
  <text class="t e" x="648" y="374">zoom</text>
  <text class="t e" x="648" y="398">brighten</text>
  <text class="t e" x="648" y="422">denoise</text>
  <text class="t e" x="778" y="350">flow</text>
  <text class="t e" x="778" y="374">pose</text>
  <text class="t e" x="778" y="398">path walked</text>

  <path class="call" d="M492,336 C530,296 590,296 626,336" marker-end="url(#ab)"/>
  <text class="t l" x="560" y="290" text-anchor="middle">tool call</text>
  <path class="back" d="M628,394 C590,434 530,434 494,394" marker-end="url(#av)"/>
  <text class="t l" x="560" y="452" text-anchor="middle">result and pictures</text>

  <!-- endings -->
  <path class="ln" d="M360,440 V474"/>
  <path class="ln" d="M306,474 H814"/>
  <path class="ln" d="M306,474 V498" marker-end="url(#a)"/>
  <path class="ln" d="M475,474 V498" marker-end="url(#a)"/>
  <path class="ln" d="M644,474 V498" marker-end="url(#a)"/>
  <path class="ln" d="M814,474 V498" marker-end="url(#a)"/>

  <rect class="box" x="230" y="500" width="153" height="64" rx="8"/>
  <text class="t h" x="246" y="526">Alert</text>
  <text class="t d m" x="246" y="548">with a grade</text>

  <rect class="box" x="399" y="500" width="153" height="64" rx="8"/>
  <text class="t h" x="415" y="526">Ask a person</text>
  <text class="t d m" x="415" y="548">a person decides</text>

  <rect class="box" x="568" y="500" width="153" height="64" rx="8"/>
  <text class="t h" x="584" y="526">Cannot judge</text>
  <text class="t d m" x="584" y="548">needs an age</text>

  <rect class="box" x="737" y="500" width="153" height="64" rx="8"/>
  <text class="t h" x="753" y="526">Dismiss</text>
  <text class="t d m" x="753" y="548">with a reason</text>

  <!-- act -->
  <path class="ln" d="M306,564 V594 H644 V564"/>
  <path class="ln" d="M475,564 V594"/>
  <path class="ln" d="M360,594 V614" marker-end="url(#a)"/>

  <rect class="box" x="230" y="616" width="260" height="64" rx="8"/>
  <text class="t h" x="246" y="642">Incident</text>
  <text class="t d m" x="246" y="664">in the control room</text>

  <path class="ln" d="M490,648 H628" marker-end="url(#a)"/>

  <rect class="box" x="630" y="616" width="260" height="64" rx="8"/>
  <text class="t h" x="646" y="642">Telegram group</text>
  <text class="t d m" x="646" y="664">a still, faces blurred</text>

  <path class="ln" d="M760,680 V716 H360 V682" marker-end="url(#a)"/>
  <text class="t l" x="560" y="738" text-anchor="middle">Acknowledge or False alarm</text>
</svg>
