[project]
name = "watchful"
version = "0.1.0"
description = "Ask your cameras: plain language watches over live and recorded video with OpenCV 5"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["backend", "eval"]
testpaths = ["backend/tests"]
addopts = "-m 'not slow'"
markers = ["slow: long speed checks, run with -m slow"]
