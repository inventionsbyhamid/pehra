# Schema migrations. The app runs `upgrade head` itself on start; from the repo root the command line works too:
#   alembic upgrade head
#   alembic revision --autogenerate -m "what changed" --rev-id 0002
# The database is DATABASE_URL from the settings.
[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = backend
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
